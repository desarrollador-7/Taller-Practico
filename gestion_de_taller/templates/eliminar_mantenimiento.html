<!DOCTYPE html>
<html lang="en">
<head>

    <title>Crear Taller</title>
    <link rel="stylesheet" href="{% static "eliminado.css" %}">
</head>
<body>

        <h2>Eliminar  el Mantenimiento de la lista</h2>

        </form>
    </div>
