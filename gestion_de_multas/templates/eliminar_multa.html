<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Carro</title>
    <link rel="stylesheet" href="{% static "eliminar_carro.css" %}">
</head>
<body>
    <div class="div">
        <h2>Eliminar Multas</h2>
        <p>¿Estás seguro de eliminar la multa con id "{{carro.placa}}" de la lista de multas?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit"> Eliminar </button>
            <a class="btn" href="{% url 'listado_multas'  %}">Cancelar</a>
        </form>
    </div>
</body>
</html>
