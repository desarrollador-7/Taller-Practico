<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Propietario</title>
    <link rel="stylesheet" href="{% static "eliminar_carro.css" %}">
</head>
<body>
    <div class="div">
        <h2>Eliminar la licencia de la lista</h2>
        <p>¿Estás seguro de eliminar la licencia "{{propietario.numero}}" del propietarios?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit"> Eliminar </button>
            <a class="btn" href="{% url 'listado_licencias'  %}">Cancelar</a>
        </form>
    </div>
</body>
</html>
