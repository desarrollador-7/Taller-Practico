<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Propietario</title>
    <link rel="stylesheet" href="{% static "crear_lista.css" %}">
</head>
<body>
    {% comment %} <!-- Mostrar mensajes -->
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %} {% endcomment %}
    
    <form class="form" method="post" action="{% if form.instance.pk %}{% url 'actualizar_propietario' form.instance.pk %}{%else %}{% url 'crear_propietario' %}{% endif %}">
        <h1>{% if form.instance.pk %} Editar Propietario {%else %} Crear Propietario {% endif %}</h1> 
        {%csrf_token%}
        {{ form.as_p }}
        <button type="submit">{% if form.instance.pk %} Editar Propietario {%else %} Crear Propietario {% endif %}</button>
        <a class="btn" href="{% url 'listado_propietarios'  %}">Volver</a>
    </form>
</body>
</html>
